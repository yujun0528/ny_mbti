            mbtiKeys.forEach(mbti => {
                const button = document.createElement('button');
                button.className = 'mbti-btn bg-amber-100 hover:bg-amber-200 active:bg-amber-300 text-amber-950 font-black py-4 px-2 rounded-2xl border-2 border-amber-300 text-lg sm:text-xl flex flex-col items-center justify-center gap-1';
                button.onclick = () => showResult(mbti);
                
                button.innerHTML = `
                    <span>${mbti}</span>
                    <span class="text-xl sm:text-2xl">${mbtiData[mbti].emoji}</span>
                `;
                grid.appendChild(button);
            });
        });

        // Show result card based on selected MBTI
        function showResult(mbti) {
            const data = mbtiData[mbti];
            if (!data) return;

            // Fill Result View elements
            document.getElementById('res-mbti-badge').textContent = mbti;
            document.getElementById('res-emoji').textContent = data.emoji;
            document.getElementById('res-name').textContent = data.name;
            document.getElementById('res-tagline').textContent = `"${data.tagline}"`;
            document.getElementById('res-desc').textContent = data.desc;

            // Fill Best Match elements
            document.getElementById('res-match-mbti').textContent = data.matchMbti;
            document.getElementById('res-match-name').textContent = data.matchName;
            document.getElementById('res-match-emoji').textContent = data.matchEmoji;
            document.getElementById('res-match-desc').textContent = data.matchDesc;

            // Toggle view visibility
            document.getElementById('select-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');

            // Scroll to top smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Reset and go back to selection view
        function resetSelection() {
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('select-view').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
